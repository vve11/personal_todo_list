[project]
name = "personal-todo-list"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask==3.0.3",
    "flask-cors==4.0.1",
    "flask-sqlalchemy==3.1.1",
    "sqlalchemy==2.0.36",
    "python-dotenv==1.0.1",
    "gunicorn==23.0.0",
    "psycopg[binary]==3.2.9",
    "redis==5.2.1",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "server:app"

[tool.vercel.scripts]
build = "cd client && npm ci && npm run build && cd .. && rm -rf public && mkdir -p public && cp -R client/dist/. public/"
